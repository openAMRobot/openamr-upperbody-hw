    part: OpenArm 2.0 printed parts (to be identified from the Enactic 2.0 BOM or CAD)
    name: OpenArm printed inserts (insert I4)
    location: verify; only parts that the Enactic 2.0 BOM lists as printed, cosmetic and non-structural
    material: verify (the public 2.0 documentation does not list printed parts; the 1.0 leader end effector is printed in PLA)
    current_finish: as delivered
    colour: orange_2004
    ral: RAL 2004
    srgb_hex: "#F44611"
    finish: printed
    process: reprint the identified part from the published file in orange filament of the same material, same print settings; keep the delivered part as the spare
    masking: not applicable
    notes: one accent colour only; no orange part within the keep-out of the chest E-stop (rule K1). Licence of the Enactic hardware files is CERN-OHL-S-2.0; keep its notices with any reprint file
